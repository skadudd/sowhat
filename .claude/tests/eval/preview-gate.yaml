name: "preview gate blocks file write on cancel"
description: "draft/finalize에서 미리보기 [2] 취소 시 파일이 생성되지 않음을 보장."
command: "/sowhat:draft"
fixtures:
  - path: "tests/fixtures/config-spec.json"
    role: "config"
  - path: "tests/fixtures/section-01-sample.md"
    role: "input"
user_inputs:
  - "2"
checks:
  - type: "file_not_exists"
    value: "export/**/*.md"
    description: "취소 시 export 파일 생성 없어야 함"
  - type: "output_contains"
    value: "미리보기 게이트"
    description: "미리보기 게이트 출력이 있어야 함"
severity: "blocking"
