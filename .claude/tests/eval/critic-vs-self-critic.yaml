name: "critic vs self-critic agent distinction"
description: "critic은 외부 콘텐츠, self-critic은 사용자 자신의 논증을 분석함을 보장."
command: "/sowhat:self-critic 01"
fixtures:
  - path: "tests/fixtures/config-planning.json"
    role: "config"
  - path: "tests/fixtures/section-01-sample.md"
    role: "input"
checks:
  - type: "output_contains"
    value: "Self-Critic 분석 결과"
    description: "self-critic 분석 결과 헤더가 있어야 함"
  - type: "output_contains"
    value: "source:user-section"
    description: "finding이 user-section 출처로 태깅되어야 함"
  - type: "output_not_contains"
    value: "Critic 분석 결과"
    description: "외부 critic 포맷이 출력되면 안 됨"
severity: "blocking"
