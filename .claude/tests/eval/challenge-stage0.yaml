name: "challenge Stage 0 Tier-A/B differentiation"
description: "Stage 0에서 Tier-A 출처 미명시는 major, Tier-B + qualifier 약화는 minor."
command: "/sowhat:challenge 01"
fixtures:
  - path: "tests/fixtures/config-planning.json"
    role: "config"
  - path: "tests/fixtures/section-tier-b-no-source-possibly.md"
    role: "input"
checks:
  - type: "output_contains"
    value: "minor"
    description: "Tier-B + possibly qualifier → minor 판정"
  - type: "output_not_contains"
    value: "major.*출처 미명시.*보조 주장"
    description: "Tier-B가 major로 판정되면 회귀"
severity: "warning"
