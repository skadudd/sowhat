name: "debate stance default = critique"
description: "debate 커맨드 기본 stance가 critique(양측 동등)임을 보장. persuade 기본값으로의 회귀 방지."
command: "/sowhat:debate 01"
fixtures:
  - path: "tests/fixtures/config-planning.json"
    role: "config"
  - path: "tests/fixtures/section-01-sample.md"
    role: "input"
checks:
  - type: "output_not_contains"
    value: "persuade 모드"
    description: "기본 실행 시 persuade 모드 메시지 없어야 함"
  - type: "output_not_contains"
    value: "사용자 입장 지지 근거를 우선 탐색"
    description: "기본 실행 시 편향 탐색 메시지 없어야 함"
  - type: "output_contains"
    value: "critique"
    description: "기본 stance가 critique임이 표시되어야 함"
severity: "blocking"
